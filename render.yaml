services:
  - type: web
    name: scandeck-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SCANNER_NO_BROWSER
        value: "1"
      - key: SCANNER_ALLOWED_ORIGINS
        value: https://muradshvv.github.io
